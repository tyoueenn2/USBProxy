name: build-aptly
on:
  push:
    paths:
      - 'aptly/Dockerfile'
    branches: master
  workflow_dispatch:

jobs:
  build-aptly:
    # Publishing requires Nesto's private registry, signing and AWS setup.
    if: github.repository == 'nesto-software/USBProxy'
    name: Build Aptly Image
    runs-on: ubuntu-latest
    steps:
      -
        name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - 
        name: Login to Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.CR_PAT }}

      - 
        name: Cache Docker layers
        uses: actions/cache@v4
        with:
          path: /tmp/.buildx-cache
          key: ${{ runner.os }}-buildx-${{ github.sha }}
          restore-keys: ${{ runner.os }}-buildx-
        
      -
        name: Build and push
        id: docker_build
        uses: docker/build-push-action@v6
        with:
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/aptly:latest
          file: aptly/Dockerfile
          target: aptly_base